name: Portfolio CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clona el repositorio
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configura pnpm
        # v2.1.0
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          cache: true

      - name: Instala las dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Contruir el proyecto
        run: pnpm build
